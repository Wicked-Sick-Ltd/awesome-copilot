name: Python CI version

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/workflows/python-ci-version.yml"
      - "eng/python-ci-version.test.mjs"
      - "**/Dockerfile"
      - "**/Dockerfile.*"
      - "**/*.Dockerfile"

permissions:
  contents: read

jobs:
  python-ci-version:
    name: python-ci-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test Python CI version
        run: node --test eng/python-ci-version.test.mjs
